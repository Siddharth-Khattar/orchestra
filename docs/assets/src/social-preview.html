<!doctype html>
<!-- ABOUTME: The repository's social preview card (1280 x 640), uploaded by hand in the GitHub repo settings. -->
<!-- ABOUTME: Shows the orc logo and the README's tagline on GitHub's dark canvas colour. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>orc social preview</title>
<link rel="stylesheet" href="figure.css">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; background: var(--bg); }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 56px;
    font-family: "Inter";
    color: var(--text);
  }
  img { height: 168px; }
  p {
    margin: 0;
    font-size: 38px;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.02em;
    text-align: center;
    color: var(--muted);
  }
  p strong { font-weight: 500; color: var(--text); }
</style>
</head>
<body>
  <img src="../logo-dark.svg" alt="orc">
  <p><strong>From interview to landed merge in Claude Code,</strong><br>every commit traceable to the decision behind it.</p>
</body>
</html>
